server {
    # oldmac.policy-log.jp のサブドメインで公開する。
    # policy-log.jp本体のserver_blockとは別ファイル・別server_nameなので、
    # 本体のnginx設定やアナリティクス計測には影響しない。
    #
    # デプロイ手順:
    #   1. さくらのDNSで oldmac.policy-log.jp のAレコード（このVPSのIP）を追加
    #   2. このファイルを /etc/nginx/sites-available/aquafox-ja に配置してnginx -t && systemctl reload nginx
    #      （この時点ではまだ80番のみ・HTTPアクセスで動作確認）
    #   3. certbot --nginx -d oldmac.policy-log.jp を実行してSSL化
    #      （certbotがこのファイルに listen 443 ssl と証明書パスを自動追記する）
    listen 80;
    server_name oldmac.policy-log.jp;

    location /static/ {
        alias /var/www/aquafox-ja/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/var/www/aquafox-ja/aquafox-ja.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
