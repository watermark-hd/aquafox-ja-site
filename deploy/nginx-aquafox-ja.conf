server {
    # ドメイン未定のため、まずポート8080でIPアクセス公開する。
    # ドメインが決まったら listen を 80 に変え、server_name を実ドメインに書き換えてから
    # certbot --nginx -d <ドメイン> を実行する。
    listen 8080;
    server_name _;

    location /static/ {
        alias /var/www/aquafox-ja/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://unix:/var/www/aquafox-ja/aquafox-ja.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
